services:
  postgres:
    # pgvector/pgvector = official postgres image + the pgvector extension
    # (semantic retrieval over document chunks).
    image: pgvector/pgvector:pg16
    container_name: mentaagent-postgres
    environment:
      POSTGRES_USER: mentaagent
      POSTGRES_PASSWORD: mentaagent
      POSTGRES_DB: mentaagent
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentaagent -d mentaagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mentaagent-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
